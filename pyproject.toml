[build-system]
# >=77 is required for the PEP 639 string `license` field below; older
# setuptools rejects this pyproject. wheel is bundled by modern setuptools.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passclip"
# Version is single-sourced from __version__ in passclip.py (see
# [tool.setuptools.dynamic]) so `passclip --version` and PyPI can never drift.
dynamic = ["version"]
description = "Security-focused CLI for managing secrets in GPG-backed environments. Extends pass with TOTP, AES-256-GCM backups, secure clipboard handling, and runtime secret injection."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "Rutvik" },
]
keywords = [
    "password-manager",
    "pass",
    "gpg",
    "clipboard",
    "totp",
    "otp",
    "security",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=15.0",
    "cryptography>=48.0.1",  # floor = current line; no upper bound by policy
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.11"]
otp = ["pyotp>=2.9"]
all = ["pyperclip>=1.11", "pyotp>=2.9"]
dev = ["pytest>=9.0", "ruff>=0.15"]

[project.scripts]
passclip = "passclip:main"

[project.urls]
Homepage = "https://github.com/rxb06/Passclip"
Repository = "https://github.com/rxb06/Passclip"
Documentation = "https://github.com/rxb06/Passclip/tree/main/docs"
Issues = "https://github.com/rxb06/Passclip/issues"
Changelog = "https://github.com/rxb06/Passclip/blob/main/docs/changelog.md"

[tool.setuptools]
py-modules = ["passclip"]

[tool.setuptools.dynamic]
version = {attr = "passclip.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/F/W/I: errors, pyflakes, warnings, import order. UP: modern syntax for the
# py311 floor. B: bugbear (real bug patterns). SIM: simplifications.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
