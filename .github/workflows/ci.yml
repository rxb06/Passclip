name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-ci.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Run tests
        run: python -m pytest tests/ -v

  credential-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload — only this job needs it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Install gitleaks
        # Release tarball pinned by SHA-256 (from the release's checksums file),
        # same policy as the hashed Python lockfile
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Gitleaks scan
        # --exit-code 0: findings are gated by credactor below; a real gitleaks
        # error still fails the step. The report holds secrets in plaintext, so
        # it goes to the runner temp dir, outside the checkout.
        run: gitleaks dir . --no-banner --exit-code 0 -f json -r "$RUNNER_TEMP/gitleaks.json"
      - name: Scan for credentials (native + gitleaks)
        run: credactor --ci --format sarif --from-gitleaks "$RUNNER_TEMP/gitleaks.json" . > results.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: always()
        with:
          sarif_file: results.sarif

  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Build package
        # --no-isolation: the build backend (setuptools) comes from the hashed
        # lockfile above, never an unverified install at build time
        run: |
          pip install --require-hashes -r requirements-ci.txt
          python -m build --no-isolation
      - name: Audit built artifacts for supply chain attacks
        run: python scripts/audit_wheel.py
      - name: Scan dependencies for known CVEs
        run: pip-audit -r requirements-ci.txt
